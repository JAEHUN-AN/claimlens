<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 370" width="660" height="370" role="img" aria-label="Illustration: by hand, 30+ minutes per claim (builder's estimate); ClaimLens, about 22.97 seconds (measured)"><rect x="8" y="8" width="392" height="354" rx="10" fill="#f7f8fa" stroke="#d9dee4"/><rect x="412" y="8" width="240" height="354" rx="10" fill="#eef4fd" stroke="#d9dee4"/><text x="24" y="34" font-size="11" letter-spacing="2" fill="#65676b">illustration</text><text x="24" y="62" font-size="18" font-weight="bold" fill="#1a1a1a">By hand: 30+ minutes per claim</text><text x="24" y="84" font-size="13" fill="#65676b">(builder's estimate)</text><g><rect x="42" y="100" width="34" height="42" rx="2" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><path d="M42 112h34 M42 121h34 M42 130h22" stroke="#65676b" stroke-width="1.4"/><text x="59" y="160" text-anchor="middle" font-size="11" fill="#65676b">certificate</text></g><g><text x="129" y="132" text-anchor="middle" font-size="22" font-family="monospace" fill="#1a1a1a">&lt;/&gt;</text><text x="129" y="160" text-anchor="middle" font-size="11" fill="#65676b">codes</text></g><g><text x="199" y="130" text-anchor="middle" font-size="24" fill="#1a1a1a">₩</text><path d="M179 134a20 20 0 0 1 36 -11" fill="none" stroke="#65676b" stroke-width="1.8"/><path d="M218 117l-1 9 -8 -4z" fill="#65676b"/><text x="199" y="160" text-anchor="middle" font-size="11" fill="#65676b">currency</text></g><g><circle cx="255" cy="108" r="2" fill="#1a1a1a"/><path d="M261 108h22" stroke="#65676b" stroke-width="1.6"/><circle cx="255" cy="119" r="2" fill="#1a1a1a"/><path d="M261 119h22" stroke="#65676b" stroke-width="1.6"/><circle cx="255" cy="130" r="2" fill="#1a1a1a"/><path d="M261 130h22" stroke="#65676b" stroke-width="1.6"/><text x="269" y="160" text-anchor="middle" font-size="11" fill="#65676b">items</text></g><g><rect x="324" y="100" width="30" height="42" rx="2" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><rect x="329" y="107" width="7" height="7" fill="none" stroke="#65676b" stroke-width="1.4"/><path d="M339 110h10" stroke="#65676b" stroke-width="1.4"/><rect x="329" y="120" width="7" height="7" fill="none" stroke="#65676b" stroke-width="1.4"/><path d="M339 123h10" stroke="#65676b" stroke-width="1.4"/><text x="339" y="160" text-anchor="middle" font-size="11" fill="#65676b">form</text></g><text x="24" y="200" font-size="12.5" fill="#1a1a1a">Doing this by hand — translating the certificate,</text><text x="24" y="222" font-size="12.5" fill="#1a1a1a">converting the codes and currency, itemising the bill</text><text x="24" y="244" font-size="12.5" fill="#1a1a1a">and filling the insurer's form — takes 30+ minutes</text><text x="24" y="266" font-size="12.5" fill="#1a1a1a">per claim (builder's estimate).</text><text x="532" y="62" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">ClaimLens:</text><text x="532" y="102" text-anchor="middle" font-size="30" font-weight="bold" fill="#0064e0">about 22.97 s</text><text x="532" y="126" text-anchor="middle" font-size="13" fill="#65676b">(measured)</text><rect x="497" y="150" width="70" height="130" rx="12" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><path d="M524 292h16" stroke="#65676b" stroke-width="2"/><circle cx="556" cy="262" r="24" fill="#0064e0"/><path d="M545 262l8 8 14 -16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>