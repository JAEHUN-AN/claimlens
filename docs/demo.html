<script id="demo-data" type="application/json">{&quot;scenes&quot;: [{&quot;id&quot;: &quot;A_niseko_wrist&quot;, &quot;title&quot;: &quot;Scene A — Korean traveller treated in Japan&quot;, &quot;reading&quot;: {&quot;docs&quot;: [&quot;receipt&quot;, &quot;medical_certificate&quot;], &quot;currency&quot;: &quot;JPY&quot;, &quot;total&quot;: &quot;235,000&quot;, &quot;diags&quot;: [&quot;S62.0&quot;], &quot;checks&quot;: [], &quot;all_passed&quot;: null}, &quot;eligibility&quot;: null, &quot;card&quot;: {&quot;decision&quot;: &quot;PAID&quot;, &quot;amount&quot;: &quot;2,216,050 KRW&quot;, &quot;summary&quot;: &quot;The claim was found covered under the applicable travel insurance terms with no exclusion applying. The actual medical cost is payable within the remaining limit, so the decision is maintained as paid.&quot;, &quot;markdown&quot;: &quot;# Claim decision: A_niseko_wrist\n\nDecision: **PAID**\nAmount: **2,216,050 KRW** (copied from the engine output)\n\nThe claim was found covered under the applicable travel insurance terms with no exclusion applying. The actual medical cost is payable within the remaining limit, so the decision is maintained as paid.\n\n## Steps\n\n- Confirmed the applicable terms version from the subscription date.\n- Identified the relevant coverage provisions.\n- Reviewed exclusion items with no certain or uncertain match.\n- Calculated payment as actual burden within the limit with no deductible subject to remaining limit.\n- Kept the paid decision on final review.\n\n## Cited clauses\n\n- `20260506/기본형 해외여행 실손의료보험/제1조` (보장종목): Describes the coverage categories forming the travel insurance product.\n- `20260506/기본형 해외여행 실손의료보험/제3조` (보장종목별 보상내용): Describes compensation content by coverage category during the policy period.\n&quot;}, &quot;pack&quot;: null, &quot;images&quot;: [&quot;../samples/A_niseko_wrist/receipt_photo.jpg&quot;, &quot;../samples/A_niseko_wrist/medical_certificate_photo.jpg&quot;]}, {&quot;id&quot;: &quot;S2_seoul_worker_bronchitis&quot;, &quot;title&quot;: &quot;Scene S2 — insured worker treated in Seoul&quot;, &quot;reading&quot;: {&quot;docs&quot;: [&quot;receipt&quot;, &quot;medical_certificate&quot;], &quot;currency&quot;: &quot;KRW&quot;, &quot;total&quot;: &quot;45,000&quot;, &quot;diags&quot;: [&quot;J20.9&quot;], &quot;checks&quot;: [{&quot;name&quot;: &quot;total_6&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;insurer_total_7&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;patient_total_8&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;amount_due_10&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;rows_sum_1&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;rows_sum_2&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;rows_sum_3&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;rows_sum_4&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;lines_present&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;lines_count&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;lines_sum&quot;, &quot;passed&quot;: true}], &quot;all_passed&quot;: true}, &quot;eligibility&quot;: {&quot;outcome&quot;: &quot;nhi_member&quot;, &quot;rule&quot;: &quot;row1_workplace&quot;, &quot;basis&quot;: &quot;Workplace subscriber from the first working day. Legal basis: National Health Insurance Act Article 109(2).&quot;}, &quot;card&quot;: {&quot;decision&quot;: &quot;PARTIAL&quot;, &quot;amount&quot;: &quot;22,500 KRW&quot;, &quot;summary&quot;: &quot;The claim was partly approved after coverage and exclusion review. An outpatient deductible was applied within the annual limit. No exclusion was found to bar payment.&quot;, &quot;markdown&quot;: &quot;# Claim decision: S2_seoul_worker_bronchitis\n\nDecision: **PARTIAL**\nAmount: **22,500 KRW** (copied from the engine output)\n\nThe claim was partly approved after coverage and exclusion review. An outpatient deductible was applied within the annual limit. No exclusion was found to bar payment.\n\n## Steps\n\n- Join date was used to confirm the applicable policy version.\n- Relevant coverage provisions were identified for review.\n- All considered exclusions were reviewed with none found certain.\n- Outpatient deductible was applied within the remaining annual limit.\n- Partial payment decision was maintained after final review.\n\n## Cited clauses\n\n- `20260506/기본형 실손의료보험(급여 실손의료비)/제1조` (보장종목): Coverage is divided into injury benefit type and disease benefit type.\n- `20260506/기본형 실손의료보험(급여 실손의료비)/제3조` (보장종목별 보상내용): Compensation and deduction details are set separately for each coverage type.\n\n## Deductible check (computed by ClaimLens from the reading)\n\nmax(20,000, 9,000, 22,500) = 22,500 — matches the engine\n&quot;}, &quot;pack&quot;: null, &quot;images&quot;: [&quot;../samples/S2_seoul_worker_bronchitis/receipt_photo.jpg&quot;, &quot;../samples/S2_seoul_worker_bronchitis/medical_certificate_photo.jpg&quot;, &quot;masking/S2_receipt_after.png&quot;]}, {&quot;id&quot;: &quot;S3_us_tourist_hip_fracture&quot;, &quot;title&quot;: &quot;Scene S3 — uninsured visitor treated in Seoul&quot;, &quot;reading&quot;: {&quot;docs&quot;: [&quot;receipt&quot;, &quot;medical_certificate&quot;], &quot;currency&quot;: &quot;KRW&quot;, &quot;total&quot;: &quot;15,000,000&quot;, &quot;diags&quot;: [&quot;S72.120&quot;], &quot;checks&quot;: [{&quot;name&quot;: &quot;total_6&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;insurer_total_7&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;patient_total_8&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;amount_due_10&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;rows_sum_1&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;rows_sum_2&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;rows_sum_3&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;rows_sum_4&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;lines_present&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;lines_count&quot;, &quot;passed&quot;: true}, {&quot;name&quot;: &quot;lines_sum&quot;, &quot;passed&quot;: true}], &quot;all_passed&quot;: true}, &quot;eligibility&quot;: {&quot;outcome&quot;: &quot;not_member_or_unknown&quot;, &quot;rule&quot;: &quot;row3_six_month&quot;, &quot;basis&quot;: &quot;Short visit or insufficient residence; no 40 percent amount is calculated because Act Articles 5, 53 and 54 may not cover Article 109 non-members. Human review. Legal basis: Act Article 109(3).&quot;}, &quot;card&quot;: null, &quot;pack&quot;: {&quot;html&quot;: &quot;&lt;!DOCTYPE html&gt;\n&lt;html lang=\&quot;en\&quot;&gt;\n&lt;head&gt;&lt;meta charset=\&quot;utf-8\&quot;/&gt;&lt;title&gt;Claim Pack: S3_us_tourist_hip_fracture&lt;/title&gt;&lt;/head&gt;\n&lt;body&gt;\n&lt;p&gt;&lt;strong&gt;We do not have your policy, so this is not a coverage decision.&lt;/strong&gt;&lt;/p&gt;\n&lt;h2&gt;Patient and visit&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Name: Michael J. CARTER — check against your passport/ID&lt;/li&gt;\n&lt;li&gt;Date of birth: 1968-04-03 — check against your passport/ID&lt;/li&gt;\n&lt;li&gt;Passport: A0000000 — check against your passport/ID&lt;/li&gt;\n&lt;li&gt;Patient ID: 20260904 — check against your passport/ID&lt;/li&gt;\n&lt;li&gt;Hospital: 서울미래대학교병원&lt;/li&gt;\n&lt;li&gt;Stay: inpatient, 2026-09-03 to 2026-09-09&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Diagnosis codes&lt;/h2&gt;\n&lt;p&gt;Certificate: Intertrochanteric fracture of the right femur, closed&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;KCD: S72.120&lt;/li&gt;\n&lt;li&gt;WHO ICD-10: S72.1 (closed)&lt;/li&gt;\n&lt;li&gt;ICD-10-CM candidate: S72.141A&lt;/li&gt;\n&lt;/ul&gt;\n&lt;ul&gt;&lt;li&gt;Needed to narrow: Displaced or nondisplaced? Defaults to displaced.&lt;/li&gt;&lt;/ul&gt;\n&lt;p&gt;Warning: Do not match S72.120 (intertrochanteric fracture, closed) to ICD-10-CM by prefix: S72.12x means lesser trochanter fracture.&lt;/p&gt;\n&lt;p&gt;Rule-based code conversion, not an official mapping.&lt;/p&gt;\n\n&lt;h2&gt;Itemized bill (KRW)&lt;/h2&gt;\n&lt;table border=\&quot;1\&quot; cellpadding=\&quot;4\&quot; cellspacing=\&quot;0\&quot;&gt;\n&lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;\n&lt;tr&gt;&lt;td&gt;Inpatient room fee (2-3 bed room)&lt;br/&gt;&lt;span lang=\&quot;ko\&quot;&gt;입원료(2·3인실)&lt;/span&gt;&lt;/td&gt;&lt;td style=\&quot;text-align:right\&quot;&gt;2,100,000&lt;/td&gt;&lt;/tr&gt;\n&lt;tr&gt;&lt;td&gt;Meal fee&lt;br/&gt;&lt;span lang=\&quot;ko\&quot;&gt;식대&lt;/span&gt;&lt;/td&gt;&lt;td style=\&quot;text-align:right\&quot;&gt;180,000&lt;/td&gt;&lt;/tr&gt;\n&lt;tr&gt;&lt;td&gt;Consultation fee&lt;br/&gt;&lt;span lang=\&quot;ko\&quot;&gt;진찰료&lt;/span&gt;&lt;/td&gt;&lt;td style=\&quot;text-align:right\&quot;&gt;150,000&lt;/td&gt;&lt;/tr&gt;\n&lt;tr&gt;&lt;td&gt;Medication and dispensing fee&lt;br/&gt;&lt;span lang=\&quot;ko\&quot;&gt;투약및조제료&lt;/span&gt;&lt;/td&gt;&lt;td style=\&quot;text-align:right\&quot;&gt;210,000&lt;/td&gt;&lt;/tr&gt;\n&lt;tr&gt;&lt;td&gt;Injection fee&lt;br/&gt;&lt;span lang=\&quot;ko\&quot;&gt;주사료&lt;/span&gt;&lt;/td&gt;&lt;td style=\&quot;text-align:right\&quot;&gt;540,000&lt;/td&gt;&lt;/tr&gt;\n&lt;tr&gt;&lt;td&gt;Anesthesia fee&lt;br/&gt;&lt;span lang=\&quot;ko\&quot;&gt;마취료&lt;/span&gt;&lt;/td&gt;&lt;td style=\&quot;text-align:right\&quot;&gt;1,250,000&lt;/td&gt;&lt;/tr&gt;\n&lt;tr&gt;&lt;td&gt;Treatment and surgery fee&lt;br/&gt;&lt;span lang=\&quot;ko\&quot;&gt;처치 및 수술료&lt;/span&gt;&lt;/td&gt;&lt;td style=\&quot;text-align:right\&quot;&gt;6,800,000&lt;/td&gt;&lt;/tr&gt;\n&lt;tr&gt;&lt;td&gt;Lab test fee&lt;br/&gt;&lt;span lang=\&quot;ko\&quot;&gt;검사료&lt;/span&gt;&lt;/td&gt;&lt;td style=\&quot;text-align:right\&quot;&gt;620,000&lt;/td&gt;&lt;/tr&gt;\n&lt;tr&gt;&lt;td&gt;Imaging fee&lt;br/&gt;&lt;span lang=\&quot;ko\&quot;&gt;영상진단료&lt;/span&gt;&lt;/td&gt;&lt;td style=\&quot;text-align:right\&quot;&gt;380,000&lt;/td&gt;&lt;/tr&gt;\n&lt;tr&gt;&lt;td&gt;CT scan fee&lt;br/&gt;&lt;span lang=\&quot;ko\&quot;&gt;CT진단료&lt;/span&gt;&lt;/td&gt;&lt;td style=\&quot;text-align:right\&quot;&gt;450,000&lt;/td&gt;&lt;/tr&gt;\n&lt;tr&gt;&lt;td&gt;Medical supplies charge&lt;br/&gt;&lt;span lang=\&quot;ko\&quot;&gt;치료재료대&lt;/span&gt;&lt;/td&gt;&lt;td style=\&quot;text-align:right\&quot;&gt;2,300,000&lt;/td&gt;&lt;/tr&gt;\n&lt;tr&gt;&lt;td&gt;Certificate issuance fee&lt;br/&gt;&lt;span lang=\&quot;ko\&quot;&gt;제증명수수료&lt;/span&gt;&lt;/td&gt;&lt;td style=\&quot;text-align:right\&quot;&gt;20,000&lt;/td&gt;&lt;/tr&gt;\n&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Total&lt;/strong&gt;&lt;/td&gt;&lt;td style=\&quot;text-align:right\&quot;&gt;&lt;strong&gt;15,000,000&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;\n&lt;/table&gt;\n&lt;p&gt;Receipt arithmetic verified: pass&lt;/p&gt;\n&lt;p&gt;Draft translation of labels; not a certified translation.&lt;/p&gt;\n&lt;h2&gt;Checklist before leaving&lt;/h2&gt;\n&lt;ul&gt;&lt;li&gt;English medical certificate: request it while still under care.&lt;/li&gt;&lt;li&gt;Itemized statement (separate from the receipt): only the patient can be issued one.&lt;/li&gt;&lt;li&gt;Your insurer&amp;#x27;s own physician statement form, if it has one.&lt;/li&gt;&lt;/ul&gt;\n&lt;h2&gt;Filing deadlines&lt;/h2&gt;\n&lt;ul&gt;&lt;li&gt;Check your own policy for notice and filing deadlines.&lt;/li&gt;&lt;/ul&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n&quot;}, &quot;images&quot;: [&quot;../samples/S3_us_tourist_hip_fracture/receipt_photo.jpg&quot;, &quot;../samples/S3_us_tourist_hip_fracture/medical_certificate_photo.jpg&quot;, &quot;masking/S3_cert_after.png&quot;]}]}</script>
<script>
function show(id){
  document.querySelectorAll('section.scene').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
const data=JSON.parse(document.getElementById('demo-data').textContent);
const nav=document.getElementById('scenes');
data.scenes.forEach((s,i)=>{
  const b=document.createElement('button');
  b.textContent=s.title;b.onclick=()=>show(s.id);
  nav.appendChild(b);
  document.getElementById('stages').insertAdjacentHTML('beforeend',stage(s,i===0));
});
function stage(s,first){
  return `<section class="scene${first?' active':''}" id="${s.id}">
  <h2>${esc(s.title)}</h2>${reading(s)}${eligibility(s)}${result(s)}${images(s)}</section>`;
}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function reading(s){
  const r=s.reading;
  const checks=r.checks.map(c=>
    `<span class="pill ${c.passed?'pass':'fail'}">${c.passed?'✓':'✗'} ${esc(c.name)}</span>`
  ).join(' ');
  return `<h3>Reading</h3><p>${esc(r.docs.join(' + '))} · ${esc(r.currency)} ·
  total ${esc(r.total)} · codes ${esc(r.diags.join(', ')||'-')}</p><p>${checks||'<span class="pill na">no bill checks</span>'}</p>`;
}
function eligibility(s){
  if(!s.eligibility)return `<h3>Eligibility</h3><p>Korean traveller abroad — engine path.</p>`;
  const e=s.eligibility;
  return `<h3>Eligibility</h3><p><strong>${esc(e.outcome)}</strong> (${esc(e.rule)})</p>
  <p><small class="dim">${esc(e.basis)}</small></p>`;
}
function result(s){
  if(s.card){
    const c=s.card;
    return `<h3>Engine card</h3><p><small class="dim">pre-existing open-source engine, pinned</small></p>
    <p>Decision: <strong>${esc(c.decision)}</strong> · Amount: <strong>${esc(c.amount)}</strong></p>
    <p>${esc(c.summary)}</p><pre>${esc(c.markdown)}</pre>`;
  }
  return `<h3>Claim Pack</h3><iframe class="pack" srcdoc="${esc(s.pack.html)}"></iframe>`;
}
function images(s){
  return (s.images||[]).map(p=>`<img class="doc" src="${esc(p)}" onerror="this.remove()">`).join('');
}
</script>
