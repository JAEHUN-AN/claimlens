[project]
name = "claimlens"
version = "0.1.0"
description = "Reads cross-border medical paperwork with Meta Muse Spark."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.9",
  "openai>=1.50",
  "python-dotenv>=1.0",
  "pillow>=10.0",
]

[project.scripts]
claimlens = "claimlens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimlens"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
